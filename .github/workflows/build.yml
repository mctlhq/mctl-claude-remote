name: Build and push image

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mctlhq/mctl-claude-remote

jobs:
  # A tag also releases plugin/mctl-bridge, which the Mac mini installs from the tag and
  # which is not in the image. The image and its gitops bump (a rollout of labs/claude-remote)
  # run only if something the Dockerfile COPYs changed since the previous release tag.
  # Anything that cannot be established (no previous tag, a failed diff, an unreadable
  # list) builds: an unknown change is never "no change".
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.scope.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test the relevance script
        run: sh .github/scripts/test-image-relevant.sh

      - name: Decide whether the image changed
        id: scope
        env:
          TAG: ${{ github.ref_name }}
        run: |
          image=true
          tags=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          prev=$(printf '%s\n' "$tags" | awk -v t="$TAG" 'f { print; exit } $0 == t { f = 1 }')
          if [ -z "$prev" ]; then
            echo "no previous release tag found; building to be safe"
          # --no-renames: a file moved out of an input path must show up under its old path too.
          # quotepath=false keeps paths literal.
          elif files=$(git -c core.quotepath=false diff --no-renames --name-only "$prev" "$TAG"); then
            echo "changed since $prev:"; echo "$files"
            if printf '%s\n' "$files" | sh .github/scripts/image-relevant.sh; then
              image=true
            else
              image=false
            fi
          else
            echo "git diff failed; building to be safe"
          fi
          echo "image=$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [ "$image" = false ]; then
            echo "Tag $TAG changes nothing in the image: no image built, no gitops bump." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: scope
    if: needs.scope.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  bump-gitops:
    needs: [scope, build]
    if: needs.scope.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Validate semver tag
        run: |
          if ! [[ "${{ github.ref_name }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${{ github.ref_name }}' is not strict semver (X.Y.Z), aborting gitops bump"
            exit 1
          fi

      # A short-lived token from the internal mctl-agents App, as the other
      # repos' release workflows mint it, instead of the GITOPS_TOKEN PAT
      # (dead since 0.14.0: 401). Scoped to dispatching workflows in
      # mctl-gitops; gitops-bump.yaml pushes with its own deploy key.
      - name: Generate Platform App token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.AGENTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops
          permission-actions: write

      - name: Dispatch gitops image bump
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh workflow run gitops-bump.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f image_name=ghcr.io/mctlhq/mctl-claude-remote \
            -f image_tag="$TAG" \
            -f values_path="platform-gitops/services/labs/claude-remote/values.yaml"
