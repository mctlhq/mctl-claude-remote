name: Build and push image

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mctlhq/mctl-claude-remote

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  bump-gitops:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Validate semver tag
        run: |
          if ! [[ "${{ github.ref_name }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${{ github.ref_name }}' is not strict semver (X.Y.Z), aborting gitops bump"
            exit 1
          fi

      - name: Dispatch gitops image bump
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh workflow run gitops-bump.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f image_name=ghcr.io/mctlhq/mctl-claude-remote \
            -f image_tag="$TAG" \
            -f values_path="platform-gitops/services/labs/claude-remote/values.yaml"
