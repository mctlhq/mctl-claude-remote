name: Build and push image

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mctlhq/mctl-claude-remote

jobs:
  # A tag also releases plugin/mctl-bridge, which the Mac mini installs from the tag and
  # which is not in the image. The image and its gitops bump (a rollout of labs/claude-remote)
  # run only if something the Dockerfile COPYs changed since the previous release tag.
  # Anything that cannot be established (no previous tag, a failed diff, an unreadable
  # list) builds: an unknown change is never "no change".
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.scope.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test the relevance script
        run: sh .github/scripts/test-image-relevant.sh

      - name: Decide whether the image changed
        id: scope
        env:
          TAG: ${{ github.ref_name }}
        run: |
          image=true
          tags=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          prev=$(printf '%s\n' "$tags" | awk -v t="$TAG" 'f { print; exit } $0 == t { f = 1 }')
          if [ -z "$prev" ]; then
            echo "no previous release tag found; building to be safe"
          # --no-renames: a file moved out of an input path must show up under its old path too.
          # quotepath=false keeps paths literal.
          elif files=$(git -c core.quotepath=false diff --no-renames --name-only "$prev" "$TAG"); then
            echo "changed since $prev:"; echo "$files"
            if printf '%s\n' "$files" | sh .github/scripts/image-relevant.sh; then
              image=true
            else
              image=false
            fi
          else
            echo "git diff failed; building to be safe"
          fi
          echo "image=$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [ "$image" = false ]; then
            echo "Tag $TAG changes nothing in the image: no image built, no gitops bump." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: scope
    if: needs.scope.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  bump-gitops:
    needs: [scope, build]
    if: needs.scope.outputs.image == 'true'
    runs-on: ubuntu-latest
    # The dispatch App key lives only in this environment (mctl-gitops#1033).
    # Its deployment policy admits `main` and semver tags; the guard below
    # keeps a tag pointing at an unmerged commit from reaching the mint.
    environment: app-dispatch
    permissions:
      contents: read
    steps:
      - name: Validate semver tag
        run: |
          if ! [[ "${{ github.ref_name }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${{ github.ref_name }}' is not strict semver (X.Y.Z), aborting gitops bump"
            exit 1
          fi

      # Fail closed: the tagged commit must be reachable from origin/main.
      # Runs before the mint and never references the App key; any failed
      # fetch, missing ref or git error (not only "not an ancestor") aborts.
      - name: Require tagged commit on main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is an ancestor of origin/main
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/remotes/origin/main^{commit}" >/dev/null; then
            echo "::error::origin/main could not be resolved; refusing to mint the dispatch token"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not an ancestor of origin/main (or the check failed); refusing to mint the dispatch token"
            exit 1
          fi

      # A short-lived token from the mctl-gitops-dispatch App (actions:write +
      # metadata:read, installed on mctl-gitops only), instead of the
      # GITOPS_TOKEN PAT (dead since 0.14.0: 401) or the broader mctl-agents
      # App. Scoped to dispatching workflows in mctl-gitops; gitops-bump.yaml
      # pushes with its own deploy key. The key is read only by this step.
      - name: Generate Platform App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops
          permission-actions: write

      - name: Dispatch gitops image bump
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh workflow run gitops-bump.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f image_name=ghcr.io/mctlhq/mctl-claude-remote \
            -f image_tag="$TAG" \
            -f values_path="platform-gitops/services/labs/claude-remote/values.yaml"
