name: Build and push image

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mctlhq/mctl-claude-remote

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  bump-gitops:
    needs: build
    runs-on: ubuntu-latest
    # The dispatch App key lives only in this environment (mctl-gitops#1033).
    # Its deployment policy admits `main` and semver tags; the guard below
    # keeps a tag pointing at an unmerged commit from reaching the mint.
    environment: app-dispatch
    permissions:
      contents: read
    steps:
      - name: Validate semver tag
        run: |
          if ! [[ "${{ github.ref_name }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${{ github.ref_name }}' is not strict semver (X.Y.Z), aborting gitops bump"
            exit 1
          fi

      # Fail closed: the tagged commit must be reachable from origin/main.
      # Runs before the mint and never references the App key; any failed
      # fetch, missing ref or git error (not only "not an ancestor") aborts.
      - name: Require tagged commit on main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is an ancestor of origin/main
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/remotes/origin/main^{commit}" >/dev/null; then
            echo "::error::origin/main could not be resolved; refusing to mint the dispatch token"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not an ancestor of origin/main (or the check failed); refusing to mint the dispatch token"
            exit 1
          fi

      # A short-lived token from the mctl-gitops-dispatch App (actions:write +
      # metadata:read, installed on mctl-gitops only), instead of the
      # GITOPS_TOKEN PAT (dead since 0.14.0: 401) or the broader mctl-agents
      # App. Scoped to dispatching workflows in mctl-gitops; gitops-bump.yaml
      # pushes with its own deploy key. The key is read only by this step.
      - name: Generate Platform App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops
          permission-actions: write

      - name: Dispatch gitops image bump
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh workflow run gitops-bump.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f image_name=ghcr.io/mctlhq/mctl-claude-remote \
            -f image_tag="$TAG" \
            -f values_path="platform-gitops/services/labs/claude-remote/values.yaml"
