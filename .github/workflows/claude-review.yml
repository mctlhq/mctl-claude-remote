name: Claude PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude-review:
    uses: mctlhq/.github/.github/workflows/claude-review.yml@a691b4513c1e55eaf716e9471863d5ee64b1272c
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      # dependabot and mctl-agents are listed so their PRs get reviewed
      # automatically. Without the slug claude-code-action hard-fails with
      # "Workflow initiated by non-human actor", and since branch protection
      # requires an approving review, those PRs then sit unmergeable until a
      # maintainer triggers a review by hand. mctl-agents is the App the
      # DevLoop implementer and release-please run under across the org.
      allowed-bots: "mctl-claude-remote,github-actions,dependabot,mctl-agents"
      sensitive-paths: '^(entrypoint\.sh|health-proxy\.js|skills/pr-steward/)'
      conventions: |
        This repo packages a self-hosted `claude --remote-control` device
        (entrypoint.sh, health-proxy.js, Dockerfile) and the pr-steward
        skill (skills/pr-steward/SKILL.md, prose instructions the device
        executes). Review accordingly:
        - Skill instructions: a SKILL.md change is logic — check that the
          steps are unambiguous, can't hang, and degrade safely (e.g. an
          App-token API denial must fall back, never block).
        - Operational safety on a live in-cluster device: anything that
          could wipe credentials, merge a PR unintentionally, or wedge the
          session is P1/P2.
        - Security: shell injection, secret/token handling, unsafe input,
          MinIO/S3 sync paths, OAuth credential flows.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
