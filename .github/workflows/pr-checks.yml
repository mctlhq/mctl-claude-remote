name: PR checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax
        run: sh -n entrypoint.sh

      - name: Node syntax
        run: node --check health-proxy.js

      # The Channel adapter's tests run against a real server: stream and
      # consumer-group semantics are the thing under test, so a fake would only
      # prove the fake. Ubuntu's redis-server speaks the same Streams protocol.
      - name: Install Redis-protocol server and zsh for adapter and launcher tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server zsh

      - name: Inbound events adapter and PTY launcher tests
        run: python3 -m unittest discover -s events/tests -p 'test_*.py' -v

      # The TypeScript port of the same adapter, shipped as a Claude Code
      # plugin that runs its source on Bun. It runs the same integration tests
      # against the same server.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install plugin dev dependencies
        working-directory: plugin/mctl-events
        run: bun install --frozen-lockfile

      - name: Plugin typecheck
        working-directory: plugin/mctl-events
        run: bunx tsc --noEmit

      - name: Plugin tests
        working-directory: plugin/mctl-events
        run: bun test

      # The orchestrator bridge: its state machine is a server-side function
      # library, tested against the same real server. The mutation run reverts
      # each guarantee in turn and fails if any revert leaves the tests green.
      - name: Bridge plugin dev dependencies
        working-directory: plugin/mctl-bridge
        run: bun install --frozen-lockfile

      - name: Bridge typecheck
        working-directory: plugin/mctl-bridge
        run: bunx tsc --noEmit

      - name: Bridge tests
        working-directory: plugin/mctl-bridge
        run: bun test

      # Pure python: proves the mutation shards below partition the list
      # exactly (disjoint, union is everything, an empty shard is an error).
      - name: Bridge mutation shard partition
        working-directory: plugin/mctl-bridge
        run: python3 -m unittest discover -s test -p 'test_*.py' -v

  # Decides whether the mutation shards below have anything to test. The run is
  # about 35 minutes x 4 shards per push, so it is skipped on pull requests that
  # touch none of its inputs. Every other trigger (push to main, manual run)
  # always runs it. A diff that cannot be computed counts as relevant: not
  # being able to look is never read as "nothing changed".
  mutation-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.scope.outputs.run }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test the relevance script
        run: sh .github/scripts/test-bridge-mutation-relevant.sh

      - name: Decide whether bridge mutation is relevant
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            # --no-renames: a file moved out of an input directory must show
            # up under its old path too. quotepath=false keeps paths literal.
            if files=$(git -c core.quotepath=false diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA"); then
              echo "changed files:"; echo "$files"
              if printf '%s\n' "$files" | sh .github/scripts/bridge-mutation-relevant.sh; then
                run=true
              else
                run=false
              fi
            else
              echo "git diff failed; running mutation to be safe"
            fi
          fi
          echo "run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # The mutation run reverts each guarantee in turn and fails if any revert
  # leaves the tests green. Every shard runs the full `bun test` per mutation;
  # sharding only splits which mutations a runner handles. Each matrix job has
  # its own checkout, so the in-place edits mutate.py makes never meet.
  bridge-mutation:
    needs: [mutation-scope]
    if: needs.mutation-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7

      # The bridge tests run against a real Redis-protocol server.
      - name: Install Redis-protocol server for bridge tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Bridge plugin dev dependencies
        working-directory: plugin/mctl-bridge
        run: bun install --frozen-lockfile

      - name: Bridge mutation check (shard ${{ matrix.shard }}/4)
        working-directory: plugin/mctl-bridge
        run: python3 test/mutate.py --shard ${{ matrix.shard }}/4

  # Built only when every check and every mutation shard passed, as before,
  # when it was the last step of the single job.
  # A skipped mutation (nothing it tests changed) still lets the build run, but
  # only when the scope job succeeded and said so.
  docker:
    needs: [checks, mutation-scope, bridge-mutation]
    if: >-
      !cancelled() && needs.checks.result == 'success' &&
      needs.mutation-scope.result == 'success' &&
      (needs.bridge-mutation.result == 'success' ||
      (needs.bridge-mutation.result == 'skipped' && needs.mutation-scope.outputs.run == 'false'))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mctl-claude-remote:ci

  # The required status check on main is exactly `validate`. It is the
  # aggregate gate: it runs even when a needed job failed, was cancelled or
  # was skipped, and passes only if every one of them is exactly `success`.
  validate:
    needs: [checks, mutation-scope, bridge-mutation, docker]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Require every gated job to have succeeded
        env:
          CHECKS: ${{ needs.checks.result }}
          SCOPE: ${{ needs.mutation-scope.result }}
          RUN_MUTATION: ${{ needs.mutation-scope.outputs.run }}
          MUTATION: ${{ needs.bridge-mutation.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          echo "checks=$CHECKS scope=$SCOPE run_mutation=$RUN_MUTATION bridge-mutation=$MUTATION docker=$DOCKER"
          [ "$CHECKS" = success ] && [ "$SCOPE" = success ] && [ "$DOCKER" = success ] || exit 1
          # Mutation may be skipped only when the scope job said it was not
          # needed; a skip for any other reason (or a missing output) fails.
          if [ "$RUN_MUTATION" = true ]; then
            [ "$MUTATION" = success ]
          else
            [ "$RUN_MUTATION" = false ] && [ "$MUTATION" = skipped ]
          fi
