name: PR checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax
        run: sh -n entrypoint.sh

      - name: Node syntax
        run: node --check health-proxy.js

      # The Channel adapter's tests run against a real server: stream and
      # consumer-group semantics are the thing under test, so a fake would only
      # prove the fake. Ubuntu's redis-server speaks the same Streams protocol.
      - name: Install Redis-protocol server for adapter tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server

      - name: Inbound events adapter and PTY launcher tests
        run: python3 -m unittest discover -s events/tests -p 'test_*.py' -v

      # The TypeScript port of the same adapter, shipped as a Claude Code
      # plugin. It runs the same integration tests against the same server.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install plugin dev dependencies
        working-directory: plugin
        run: npm ci

      - name: Plugin typecheck
        working-directory: plugin
        run: npm run typecheck

      # dist/ is committed because Claude Code runs the plugin straight from
      # the marketplace clone, with no build step of its own.
      - name: Plugin dist matches a fresh build
        working-directory: plugin
        run: npm run check-dist

      - name: Plugin tests
        working-directory: plugin
        run: npm test

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mctl-claude-remote:ci
